name: Build APK

on:
  push:
    branches-ignore: [apk-output]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Logic tests
        run: mkdir -p build && bash tools/tests/run.sh

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: clackwell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to apk-output branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Clackwell-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-output
          git rm -rf . -q
          cp /tmp/Clackwell-debug.apk .
          git add Clackwell-debug.apk
          git commit -q -m "Debug APK"
          git push -f origin apk-output
